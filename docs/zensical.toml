[project]
site_name = "Regis"
site_description = "The Ultimate Group Admin: Smart Moderation, Auto Filters, File Storage & More."
repo_url = "https://github.com/soymadip/Regis"
repo_name = "soymadip/Regis"
edit_uri = "edit/main/docs/docs"
extra_css = ["src/custom.css"]

nav = [
  { "Get started" = "index.md" },
  { "Deployment" = "deploy.md" },
  { "Commands" = "commands.md" },
  { "Credits" = "credits.md" },
]

[project.theme]
custom_dir = "overrides"
logo = "src/icon.png"
favicon = "src/icon.png"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "slate"
primary = "deep orange"
accent = "orange"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/soymadip/Regis"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
tables = {}